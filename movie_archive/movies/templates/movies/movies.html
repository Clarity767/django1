{% extends "movies/base.html" %}

{% block title %}Каталог фільмів{% endblock %}

{% block content %}



<h1 class="page-title">🎬 Каталог фільмів</h1>

<div class="top-actions">
    <a href="{% url 'add_movie' %}" class="btn">
        ➕ Додати фільм
    </a>
</div>

<div class="movies-grid">
    {% for movie in movies %}
    <div class="movie-card">

        <div class="poster">
            <img src="{{ movie.poster.url }}" alt="{{ movie.title }}">
        </div>

        <div class="movie-info">
            <h3>{{ movie.title }}</h3>
            <p>{{ movie.year }} • {{ movie.genre }}</p>
            <p class="director">{{ movie.director }}</p>
        </div>

        <div class="movie-actions">
            <a href="{% url 'movie_detail' movie.pk %}">Детальніше</a>
            <a href="{% url 'movie_edit' movie.pk %}">Редагувати</a>
            <a href="{% url 'movie_delete' movie.pk %}" class="delete">Видалити</a>
        </div>

    </div>
    {% endfor %}
</div>

{% endblock %}
