{% extends 'base.html' %}
{% block title %}
Вакансії
{% endblock %}

{% block content %}

<h1>Пошук роботи</h1>

{% for job in jobs %}
<div class="card">
    <h2>{{ job.title }}</h2>
    <p>Компанія: {{ job.company }}</p>
    <p>Зарплата: {{ job.salary }}</p>

    <a href="{% url 'detail' job.id %}" class="btn">
        Детальніше
    </a>
</div>
{% endfor %}

{% endblock %}
